name: Rebuild flowchart from data.json

on:
  push:
    branches: ["main"]
    paths:
      - "data.json"          # only runs when data.json changes
      - "src/**"             # or when source code changes
      - "generate-data.js"

  workflow_dispatch:         # also allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Regenerate App.jsx from data.json
        run: node generate-data.js

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
